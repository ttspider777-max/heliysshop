<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Дизайн: тёмный OLED-стиль. Плоские поверхности, тонкие границы, SVG-иконки, акцент — цвет сезона. */
:root {
  --accent: #ff7a1a;
  --accent-ink: #140800;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Unbounded", "Manrope", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --z-nav: 20; --z-sheet: 40; --z-toast: 60;
}
:root, :root[data-theme="dark"] {
  --bg: #000000;
  --surface: #0f0f11;
  --surface-2: #18181b;
  --surface-3: #222226;
  --line: #232328;
  --text: #f5f5f7;
  --muted: #8e8e96;
  --nav: rgba(10, 10, 12, .94);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f1f1f4;
  --surface: #ffffff;
  --surface-2: #f4f4f7;
  --surface-3: #ebebf0;
  --line: #e2e2e8;
  --text: #0c0c10;
  --muted: #5d606b;
  --nav: rgba(255, 255, 255, .96);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 500 15px/1.5 var(--font);
  color: var(--text);
  background-color: var(--bg);
  background-image: var(--wall);
  background-size: var(--wall-size, 320px 320px);
  background-attachment: fixed;
  background-position: center;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; display: block; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 26px; height: 26px; }
.wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 12px 16px calc(92px + var(--safe-b)); }
.screen { display: none; animation: rise .22s ease-out; }
.screen.on { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- карточка на главной ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-lg); min-height: 228px; padding: 16px;
  background: #0c0c0e; color: #fff; isolation: isolate; border: 1px solid var(--line);
}
.hero.no-photo { background: radial-gradient(90% 70% at 100% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), #0c0c0e; }
.hero-media { position: absolute; inset: 0; z-index: -2; }
.hero-media img, .hero-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,0) 52%, rgba(0,0,0,.7) 100%); }
.hero-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
.hero-title { font: 700 19px/1.15 var(--display); letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.14); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.badge .bi { width: 24px; height: 24px; display: grid; place-items: center; font-size: 18px; }
.logo { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; border: 1.5px solid rgba(255,255,255,.25); background: #151517; display: grid; place-items: center; font: 600 12px var(--display); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.hero-bottom { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 14px; }
.hero-label { font-size: 13px; color: rgba(255,255,255,.72); font-weight: 600; }
.balance-row { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
.balance { font: 700 40px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.balance small { font-size: 22px; font-weight: 600; color: rgba(255,255,255,.55); margin-left: 4px; }
.plus { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #000; transition: transform .15s; }
.plus:active { transform: scale(.94); }
.status-pill { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 3px; border-radius: 999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); font-weight: 700; font-size: 13.5px; }
.status-pill .av { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #26262b; font-size: 15px; }
.status-pill .av img { width: 100%; height: 100%; object-fit: cover; }
.hero-edit { position: absolute; z-index: 2; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18); color: #fff; font-weight: 700; font-size: 13px; overflow: hidden; }
.hero-edit input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.fx { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

/* летучие мыши */
.bat { position: absolute; top: var(--y); left: -12%; width: var(--s); animation: fly var(--d) linear var(--delay) infinite; }
.bat.rev { animation-name: fly-rev; }
.bat .bob { animation: bob calc(var(--d) / 4) ease-in-out infinite; }
.bat svg { width: 100%; display: block; overflow: visible; }
.bat.rev svg { transform: scaleX(-1); }
.bat .wing { transform-box: fill-box; transform-origin: 50% 70%; animation: flap .34s ease-in-out infinite; }
@keyframes fly { from { left: -14%; } to { left: 112%; } }
@keyframes fly-rev { from { left: 112%; } to { left: -14%; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(14px) rotate(5deg); } }
@keyframes flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.35) translateY(4px); } }
.p { position: absolute; top: -10%; left: var(--x); width: var(--s); height: var(--s); animation: fall var(--d) linear var(--delay) infinite; opacity: var(--o, .9); }
.p.up { top: auto; bottom: -10%; animation-name: rise-up; }
.p > * { width: 100%; height: 100%; display: block; animation: sway calc(var(--d) / 3) ease-in-out infinite alternate; }
@keyframes fall { to { top: 110%; } }
@keyframes rise-up { to { bottom: 110%; } }
@keyframes sway { from { transform: translateX(-10px) rotate(-25deg); } to { transform: translateX(10px) rotate(35deg); } }
.flake { border-radius: 50%; background: #fff; }
.pumpkin { transform-origin: 50% 85%; animation: wobble 2.6s ease-in-out infinite; }
.pumpkin .face { animation: flicker 1.8s steps(1) infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-1px); } }
@keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .55; } 45% { opacity: 1; } 70% { opacity: .8; } }
.spin { animation: spin 9s linear infinite; }
.beat { animation: beat 1.1s ease-in-out infinite; transform-origin: center; }
.sway-i { animation: wobble 3s ease-in-out infinite; transform-origin: 50% 100%; }
.blink { animation: flicker 1.2s steps(1) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.96); } 45% { transform: scale(1.1); } }

/* ---------- общие блоки ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 12px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.section-title small { font-weight: 600; font-size: 13px; color: var(--muted); }
.bonus { margin-top: 10px; padding: 12px 12px 12px 12px; display: flex; align-items: center; gap: 12px; }
.bonus .ico { width: 42px; height: 42px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; font-size: 22px; }
.bonus .txt { flex: 1; min-width: 0; }
.bonus b { display: block; font-size: 15px; font-weight: 700; }
.bonus span { color: var(--muted); font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-md); font-weight: 700; background: var(--accent); color: var(--accent-ink); transition: opacity .15s, transform .12s; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.block { width: 100%; height: 52px; font-size: 16px; }
.btn.sm { height: 36px; padding: 0 14px; border-radius: var(--r-sm); font-size: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; color: var(--text); transition: background .15s, border-color .15s; }
.chip .ic { width: 17px; height: 17px; color: var(--muted); }
.chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
.chip.on .ic { color: var(--bg); }
.search { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; margin-top: 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; min-width: 0; color: var(--text); }
.search input::placeholder { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat { overflow: hidden; border-radius: var(--r-lg); text-align: left; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; transition: border-color .15s; }
.cat:active, .prod:active { opacity: .85; }
.cat .cm { position: relative; aspect-ratio: 16 / 10; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.cat .cm img, .cat .cm video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cat .ce { font-size: 34px; line-height: 1; }
.cat .ce .pe { width: 40px; height: 40px; }
.cat .cb { padding: 10px 12px 12px; display: flex; align-items: center; gap: 8px; }
.cat .cb > div { flex: 1; min-width: 0; }
.cat b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat span.n { font-size: 12.5px; color: var(--muted); }
.cat .ic { color: var(--muted); width: 16px; height: 16px; }
.prod { overflow: hidden; border-radius: var(--r-lg); text-align: left; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
.prod .pm { aspect-ratio: 1 / 1; background: var(--surface-2); display: grid; place-items: center; font-size: 42px; color: var(--muted); position: relative; overflow: hidden; }
.prod .pm .ic { width: 34px; height: 34px; opacity: .6; }
.prod .pm img, .prod .pm video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.prod .pi { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.prod .pn { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.price { font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
.price s { color: var(--muted); font: 500 12.5px var(--font); margin-left: 6px; }
.tag { position: absolute; top: 8px; left: 8px; padding: 3px 7px; border-radius: 7px; font-size: 11.5px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.tag.out { background: rgba(0,0,0,.72); color: #fff; }
.prod .stock { font-size: 12px; color: var(--muted); margin-top: auto; }

/* ---------- товар ---------- */
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 40px; }
.topbar h2 { margin: 0; font-size: 19px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.iconbtn { width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; color: var(--text); }
.iconbtn.on { color: #ff4d5e; }
.pmedia { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; font-size: 64px; color: var(--muted); position: relative; border: 1px solid var(--line); }
.pmedia .ic { width: 48px; height: 48px; opacity: .5; }
.pmedia img, .pmedia video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.pbody { margin-top: 10px; padding: 16px; }
.pbody h1 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.big-price { font: 700 26px var(--display); font-variant-numeric: tabular-nums; }
.big-price s { font: 500 15px var(--font); color: var(--muted); margin-left: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: #34c77b; } .pill.no { color: #ff5a5f; }
.desc { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; font-size: 15px; line-height: 1.6; }
.desc blockquote, .rich blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.desc code, .rich code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 13.5px; }
.tg-spoiler { background: var(--muted); color: transparent; border-radius: 4px; cursor: pointer; }
.tg-spoiler.open { background: none; color: inherit; }
.qty { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.qty button { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; }
.qty input { width: 72px; height: 44px; text-align: center; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font: 600 16px var(--display); outline: 0; }
.qty .total { margin-left: auto; text-align: right; }
.qty .total span { display: block; font-size: 12px; color: var(--muted); }
.buybar { position: sticky; bottom: calc(76px + var(--safe-b)); margin-top: 12px; display: flex; gap: 10px; z-index: 5; }
.buybar .btn { flex: 1; height: 54px; font-size: 16px; }

/* ---------- профиль ---------- */
.prof { padding: 16px; display: flex; gap: 14px; align-items: center; }
.ava { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; font: 600 22px var(--display); background: var(--surface-3); }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.prof h2 { margin: 0; font-size: 19px; font-weight: 800; }
.prof .sub { color: var(--muted); font-size: 13.5px; }
.idbtn { margin-top: 6px; display: inline-flex; gap: 6px; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stat { padding: 12px; }
.stat b { display: block; font: 600 16px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
.statuscard { margin-top: 10px; padding: 16px; }
.st-head { display: flex; align-items: center; gap: 12px; }
.st-ico { width: 46px; height: 46px; border-radius: var(--r-md); display: grid; place-items: center; font-size: 24px; background: var(--surface-2); }
.st-head b { font-size: 18px; display: block; font-weight: 800; }
.st-head span { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-3); margin-top: 14px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s ease-out; }
.st-list { margin-top: 12px; display: grid; gap: 2px; }
.st-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; color: var(--muted); }
.st-row.cur { background: var(--surface-2); color: var(--text); font-weight: 800; }
.st-row .em { width: 24px; height: 24px; display: grid; place-items: center; font-size: 17px; }
.st-row .mn { margin-left: auto; font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-align: left; width: 100%; }
.row .ri { width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 19px; background: var(--surface-2); color: var(--text); flex: none; }
.row .rt { flex: 1; min-width: 0; }
.row .rt b { display: block; font-size: 15px; font-weight: 700; }
.row .rt span { color: var(--muted); font-size: 13px; }
.row .chev { color: var(--muted); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.seg button { flex: 1; height: 36px; border-radius: var(--r-sm); font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.field { display: flex; gap: 8px; margin-top: 10px; }
.field input { flex: 1; height: 46px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; outline: 0; min-width: 0; font-size: 16px; }
.field input:focus { border-color: var(--accent); }
.order { padding: 14px; }
.order .oh { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.order b { font-size: 15px; font-weight: 700; }
.order .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.order .content { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
.st-chip { padding: 3px 8px; border-radius: 7px; font-size: 12px; font-weight: 700; background: var(--surface-2); white-space: nowrap; }
.st-chip.done { color: #34c77b; } .st-chip.pending, .st-chip.wait_pay, .st-chip.manual { color: #f0ad3c; } .st-chip.rejected, .st-chip.canceled { color: #ff5a5f; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 600; }
.empty .ei { display: grid; place-items: center; margin-bottom: 10px; font-size: 40px; }
.empty .ei .ic { width: 40px; height: 40px; }

/* ---------- нижнее меню ---------- */
.nav { position: fixed; z-index: var(--z-nav); left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 6px 8px calc(6px + var(--safe-b)); background: var(--nav); border-top: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.nav .in { display: flex; width: 100%; max-width: 560px; }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: var(--muted); font-size: 11px; font-weight: 700; transition: color .15s; min-height: 50px; }
.nav button .ni { height: 24px; display: grid; place-items: center; font-size: 21px; }
.nav button .ni .ic { width: 23px; height: 23px; }
.nav button.on { color: var(--accent); }

/* ---------- шторка и уведомления ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: var(--z-sheet); background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet-bg.on { opacity: 1; pointer-events: auto; }

  });
  const els = [...root.querySelectorAll(".pe[data-eid]:not([data-done])")];
  if (!els.length || DEMO) return;
  const need = [...new Set(els.map((e) => e.dataset.eid))].filter((id) => !(id in S.emoji));
  if (need.length) {
    try {
      const r = await fetch(BASE + "api/emoji?ids=" + need.join(","));
      Object.assign(S.emoji, await r.json());
    } catch (e) {}
    need.forEach((id) => { if (!(id in S.emoji)) S.emoji[id] = null; });
  }
  for (const el of els) {
    const info = S.emoji[el.dataset.eid];

    const url = BASE + info.url;
    if (info.type === "image") { el.innerHTML = `<img src="${url}" alt="">`; }
    else if (info.type === "video" && still && info.thumb) { el.innerHTML = `<img src="${BASE + info.thumb}" alt="">`; }
    else if (info.type === "video") {
      el.innerHTML = `<video src="${url}" ${info.thumb ? `poster="${BASE + info.thumb}"` : ""} autoplay loop muted playsinline></video>`;
      const v = el.querySelector("video"); v.onerror = () => { if (info.thumb) el.innerHTML = `<img src="${BASE + info.thumb}" alt="">`; };
    } else {
      try {
        const lottie = await loadLottie();
        el.textContent = "";
        const anim = lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: !still, path: url });
        if (still) anim.addEventListener("DOMLoaded", () => anim.goToAndStop(0, true));
      } catch (e) {}
    }
  }

function fxHtml(season) {

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === "s-" + id));
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === S.tab && !S.stack.length));
  try { if (tg && tg.BackButton) S.stack.length ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
function go(tab) { S.tab = tab; S.stack = []; render(tab); haptic("light"); }
function push(screen, arg) { S.stack.push([screen, arg]); render(screen, arg); }
function back() {
  S.stack.pop();
  const top = S.stack[S.stack.length - 1];
  if (top) render(top[0], top[1]); else render(S.tab);
}
async function render(name, arg) {
  if (name === "home") renderHome();
  else if (name === "catalog") renderCatalog();
  else if (name === "orders") await renderOrders();
  else if (name === "profile") renderProfile();
  else if (name === "list") await renderList(arg);
  else if (name === "product") await renderProduct(arg);
  show(name === "list" || name === "product" ? name : name);
}

async function renderProduct(pid) {
  const el = $("#s-product");
  el.innerHTML = `<div class="topbar"><button class="iconbtn" data-act="back" aria-label="back">${svg("left")}</button><h2></h2></div><div class="skeleton" style="aspect-ratio:4/3"></div><div class="skeleton" style="height:180px;margin-top:14px"></div>`;
  let p;
  try { p = (await api("product/" + pid)).product; } catch (e) { toast(e.message || "Ошибка"); return; }
  S.product = p; S.qty = 1;
  const media = p.media ? (p.media.type === "photo" ? `<img src="${mediaUrl(p.media)}" alt="">` : `<video src="${mediaUrl(p.media)}" autoplay loop muted playsinline controls></video>`)
    : (p.emoji_id ? pe(p.emoji_id, firstEmoji(p.name) || "") : (firstEmoji(p.name) ? esc(firstEmoji(p.name)) : svg("bag")));
  const out = p.stock === 0;
  const stockPill = out ? `<span class="pill no"><span class="dot"></span>${T("app_out")}</span>` : `<span class="pill ok"><span class="dot"></span>${T("app_in_stock")}${p.stock > 0 ? ": " + p.stock : ""}</span>`;
  const qty = p.multi && !out ? `<div class="qty"><button data-q="-1" aria-label="minus">${svg("minus")}</button><input id="qty" inputmode="numeric" value="1"><button data-q="1" aria-label="plus">${svg("plus")}</button>
    <div class="total"><span>${L("Итого", "Total")}</span><b class="price" id="total">${money(p.promo_price || p.price)}</b></div></div>` : "";
  el.innerHTML = `<div class="topbar"><button class="iconbtn" data-act="back" aria-label="back">${svg("left")}</button><h2>${esc(p.cat_name ? stripEmoji(p.cat_name) : "")}</h2>
      ${isAdmin() ? `<button class="iconbtn" data-act="edit-prod" aria-label="edit">${svg("pencil")}</button>` : ""}
      <button class="iconbtn ${p.fav ? "on" : ""}" data-act="fav" aria-label="fav">${svg("heart")}</button></div>
    ${isAdmin() && p.active === false ? `<div class="pill no" style="margin-bottom:10px">${svg("eyeoff", "sm")} ${L("Скрыт от покупателей", "Hidden from customers")}</div>` : ""}
    <div class="pmedia">${media}</div>
    <div class="card pbody">
      <h1>${p.emoji_id ? pe(p.emoji_id, "") + " " : ""}${esc(p.emoji_id ? stripEmoji(p.name) : p.name)}</h1>
      <div class="prow"><div class="big-price">${money(p.price)}${p.old_price ? `<s>${money(p.old_price)}</s>` : ""}</div>${stockPill}</div>
      ${p.promo_pct ? `<div class="pill" style="margin-top:10px">${svg("ticket", "sm")} −${p.promo_pct}% → <b>${money(p.promo_price)}</b></div>` : ""}
      ${qty}
      ${p.description ? `<div class="desc rich">${p.description}</div>` : ""}
    </div>
    <div class="buybar">${out ? `<button class="btn ghost" data-act="notify">${svg("bell", "sm")} ${T("app_notify")}</button>` : `<button class="btn" data-act="buy">${T("app_buy")} · <span id="buyTotal">${money(p.promo_price || p.price)}</span></button>`}</div>`;
  hydrateEmoji(el);
  el.querySelectorAll(".tg-spoiler").forEach((s) => s.addEventListener("click", () => s.classList.add("open")));
}
function unitPrice() { const p = S.product; return p.promo_price || p.price; }
function setQty(n) {
  const p = S.product; const max = Math.max(1, p.max_qty || 1);
  S.qty = Math.min(Math.max(1, n | 0), max);
  const inp = $("#qty"); if (inp) inp.value = S.qty;
  const tot = Math.round(unitPrice() * S.qty * 100) / 100;
  if ($("#total")) $("#total").textContent = money(tot);
  if ($("#buyTotal")) $("#buyTotal").textContent = money(tot);
}
function stars(rub) { return Math.max(1, Math.ceil(Math.round(rub / (S.shop.star_rate || 2) * 1e6) / 1e6)); }
function openPay() {
  const p = S.product, total = Math.round(unitPrice() * S.qty * 100) / 100;
  const pay = S.shop.pay, bal = S.user.balance;
  const enough = bal >= total;
  sheet(`<h3>${esc(stripEmoji(p.name))}${S.qty > 1 ? " × " + S.qty : ""}</h3><p>${L("К оплате", "To pay")}: <b style="color:var(--text)">${money(total)}</b></p>
    ${pay.balance ? `<button class="pay" data-pay="balance"><span class="pi2">${svg("wallet")}</span><span><b>${T("app_pay_balance")}</b><span>${L("На балансе", "Balance")}: ${money(bal)}</span></span><span class="rt2">${enough ? money(total) : `<span class="btn sm" data-act="topup">${L("Пополнить", "Top up")}</span>`}</span></button>` : ""}
    ${pay.stars ? `<button class="pay" data-pay="stars"><span class="pi2">${svg("star")}</span><span><b>${T("app_pay_stars")}</b><span>Telegram Stars</span></span><span class="rt2">${stars(total)} ${svg("star", "sm")}</span></button>` : ""}
    ${pay.sbp ? `<button class="pay" data-pay="sbp"><span class="pi2">${svg("bank")}</span><span><b>${T("app_pay_sbp")}</b><span>${L("Реквизиты придут в чат", "Details will come to the chat")}</span></span><span class="rt2">${money(total)}</span></button>` : ""}
    ${S.shop.docs.length ? `<p style="margin-top:12px;font-size:12.5px">${L("Оплачивая, вы принимаете", "By paying you accept")} ${S.shop.docs.map((d) => d.url ? `<a href="#" data-link="${esc(d.url)}">${esc(d.name)}</a>` : esc(d.name)).join(", ")}</p>` : ""}`);
}
async function doBuy(method) {
  const p = S.product;
  if (method === "balance" && S.user.balance < unitPrice() * S.qty) { closeSheet(); return openTopup(); }
  setBusy(true);
  try {
    const r = await api("buy", { pid: p.id, qty: S.qty, method });
    if (r.invoice) {
      closeSheet();
      return openInvoice(r.invoice, () => { toast(L("Оплачено! Товар — в чате с ботом", "Paid! The product is in the bot chat")); refreshMe(); });
    }
    if (r.sbp) { sheet(`<h3>${svg("bank")} ${T("app_pay_sbp")}</h3><p>${esc(r.message)}</p><button class="btn block" data-act="close-app">${L("Перейти в чат", "Go to chat")}</button>`); return; }
    haptic("ok");
    sheet(`<div class="empty" style="padding:4px 0 0;color:#34c77b"><div class="ei">${ic("success")}</div></div><h3 style="text-align:center">${L("Заказ", "Order")} #${r.oid}</h3>
      <p style="text-align:center">${r.content ? T("app_done") : esc(r.status)}</p>
      ${r.content ? `<div class="order"><div class="content">${esc(r.content)}</div><button class="btn block ghost" style="margin-top:10px" data-copy="${esc(r.content)}">${svg("copy", "sm")} ${L("Скопировать", "Copy")}</button></div>` : ""}
      <button class="btn block" style="margin-top:10px" data-act="close-sheet">OK</button>`);
    hydrateEmoji($("#sheet"));
    refreshMe();
  } catch (e) {
    haptic("err");
    if (e.error === "no_money") { closeSheet(); openTopup(e.need); }
    else toast(e.message || "Ошибка");
  } finally { setBusy(false); }
}
function openInvoice(link, onPaid) {
  if (tg && tg.openInvoice) tg.openInvoice(link, (status) => { if (status === "paid") { haptic("ok"); onPaid && onPaid(); } });
  else window.open(link, "_blank");
}

/* ---------- пополнение ---------- */
let topupAmount = null;
function openTopup(need) {
  const t = S.shop.topup;
  const pre = need ? Math.max(Math.ceil(need), t.min) : null;
  topupAmount = pre;
  sheet(`<h3>${ic("topup", "💳")} ${T("app_topup")}</h3><p>${L("Минимум", "Minimum")}: ${money(t.min)}${need ? " · " + L("не хватает", "missing") + " " + money(need) : ""}</p>
    <div class="amounts">${t.amounts.map((a) => `<button data-amt="${a}">${money(a)}</button>`).join("")}</div>
    <div class="field"><input id="amt" inputmode="decimal" placeholder="${L("Своя сумма, ₽", "Custom amount, ₽")}" value="${pre || ""}"></div>
    <button class="pay" data-top="stars"><span class="pi2">${svg("star")}</span><span><b>${T("app_pay_stars")}</b><span>Telegram Stars</span></span><span class="rt2" id="starsAmt"></span></button>
    ${S.shop.pay.sbp ? `<button class="pay" data-top="sbp"><span class="pi2">${svg("bank")}</span><span><b>${T("app_pay_sbp")}</b><span>${L("Чек проверит администратор", "The admin will check the receipt")}</span></span></button>` : ""}`);
  hydrateEmoji($("#sheet"));
  const upd = () => { const v = parseFloat(($("#amt").value || "").replace(",", ".")); topupAmount = v > 0 ? v : null; $("#starsAmt").textContent = topupAmount ? stars(topupAmount) + " ⭐" : ""; document.querySelectorAll("[data-amt]").forEach((b) => b.classList.toggle("on", +b.dataset.amt === topupAmount)); };
  $("#amt").addEventListener("input", upd); upd();
}
async function doTopup(method) {
  if (!topupAmount || topupAmount < S.shop.topup.min) { haptic("err"); return toast(L("Минимум ", "Minimum ") + money(S.shop.topup.min)); }
  setBusy(true);
  try {
    const r = await api("topup", { amount: topupAmount, method });
    if (r.invoice) { closeSheet(); return openInvoice(r.invoice, () => { toast(L("Баланс пополнен", "Balance topped up")); setTimeout(refreshMe, 1200); }); }
    sheet(`<h3>${svg("bank")} ${T("app_pay_sbp")}</h3><p>${esc(r.message)}</p><button class="btn block" data-act="close-app">${L("Перейти в чат", "Go to chat")}</button>`);
  } catch (e) { toast(e.message || "Ошибка"); } finally { setBusy(false); }
}

/* ---------- общие элементы ---------- */
function sheet(html) { $("#sheet").innerHTML = `<div class="grab"></div>${html}`; $("#sheet").classList.add("on"); $("#sheetBg").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); }
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function setBusy(b) { document.querySelectorAll("#sheet .pay, #sheet .btn, .buybar .btn").forEach((x) => x.toggleAttribute("disabled", b)); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  haptic("ok"); toast(L("Скопировано", "Copied"));
}
function openLink(url) {
  if (!url) return;
  if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) tg.openTelegramLink(url);
  else if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
}
async function refreshMe() {
  try { S.user = (await api("me")).user; } catch (e) { return; }
  if (S.tab === "home" && !S.stack.length) renderHome();
  if (S.tab === "profile" && !S.stack.length) renderProfile();
}

/* ---------- клики ---------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tab],[data-list],[data-prod],[data-act],[data-pay],[data-top],[data-amt],[data-copy],[data-link],[data-q],[data-theme-set],[data-lang-set]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.list) { haptic(); return push("list", d.list); }
  if (d.prod) { haptic(); return push("product", +d.prod); }
  if (d.copy !== undefined) return copy(d.copy);
  if (d.link !== undefined) { e.preventDefault(); return openLink(d.link); }
  if (d.q) return setQty(S.qty + +d.q);
  if (d.pay) return doBuy(d.pay);
  if (d.top) return doTopup(d.top);
  if (d.amt) { $("#amt").value = d.amt; $("#amt").dispatchEvent(new Event("input")); return haptic(); }
  if (d.themeSet) { lsSet("theme", d.themeSet); applyTheme(); renderProfile(); return haptic(); }
  if (d.langSet) { try { await api("lang", { lang: d.langSet }); } catch (x) {} return boot(); }
  switch (d.act) {
    case "back": return back();
    case "topup": e.stopPropagation(); closeSheet(); return openTopup();
    case "profile": return go("profile");
    case "search": go("catalog"); return setTimeout(() => $("#q") && $("#q").focus(), 60);
    case "buy": haptic("medium"); return openPay();
    case "notify": try { const r = await api("notify", { pid: S.product.id }); toast(r.message.replace(/<[^>]+>/g, "")); } catch (x) {} return;
    case "fav": try { const r = await api("fav", { pid: S.product.id }); S.product.fav = r.fav; t.classList.toggle("on", r.fav); haptic(); } catch (x) {} return;
    case "bonus": try { const r = await api("bonus", {}); S.user = r.user; haptic("ok"); toast(r.message); S.stack.length || render(S.tab); } catch (x) { toast(x.message || "…"); } return;
    case "promo": { const code = ($("#promo").value || "").trim(); if (!code) return; try { const r = await api("promo", { code }); S.user = r.user; toast(r.message); renderProfile(); } catch (x) { haptic("err"); toast(x.message || "…"); } return; }
    case "ref": return openRef();
    case "share": return openLink(`https://t.me/share/url?url=${encodeURIComponent(S.user.ref.link)}`);
    case "support": return openLink(`https://t.me/${S.shop.bot}?start=support`);
    case "close-sheet": return closeSheet();
    case "close-app": closeSheet(); try { tg && tg.close(); } catch (x) {} return;
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "qty") setQty(parseInt(e.target.value || "1", 10)); });
$("#sheetBg").addEventListener("click", () => closeSheet());

/* ---------- ворота: подписка, согласие, техработы ---------- */
function gate(err) {
  $("#nav").hidden = true;
  let body = `<div class="gi">${svg("lock", "lg")}</div><h2>${esc(err.message || "Ошибка")}</h2>`;
  if (err.error === "sub") body = `<div class="gi">${svg("megaphone", "lg")}</div><p>${esc(err.message)}</p><div class="list" style="margin-top:14px">${err.channels.map((c) => `<button class="card row" data-link="${esc(c.url)}"><span class="ri">${svg("megaphone")}</span><span class="rt"><b>${esc(c.title)}</b></span><span class="chev">${svg("right")}</span></button>`).join("")}</div><button class="btn block" style="margin-top:14px" id="retry">${L("Я подписался", "I subscribed")}</button>`;
  else if (err.error === "agree") body = `<div class="gi">${svg("file", "lg")}</div><p>${esc(err.message)}</p><div class="list" style="margin-top:14px">${(err.docs || []).map((d) => `<button class="card row" data-link="${esc(d.url || "")}"><span class="ri">${svg("file")}</span><span class="rt"><b>${esc(d.name)}</b></span><span class="chev">${svg("right")}</span></button>`).join("")}</div><button class="btn block" style="margin-top:14px" id="agree">${L("Принимаю", "I agree")}</button>`;
  else if (err.error === "maint") body = `<div class="gi">${svg("wrench", "lg")}</div><p>${esc(err.message)}</p><button class="btn block ghost" style="margin-top:14px" id="retry">${svg("refresh", "sm")} ${L("Обновить", "Refresh")}</button>`;
  else if (err.error === "auth") body = `<div class="gi">${svg("send", "lg")}</div><h2>${L("Откройте магазин из Telegram", "Open the shop from Telegram")}</h2><p class="muted">${L("Мини-приложение работает внутри Telegram.", "The mini app works inside Telegram.")}</p>`;
  else body += `<button class="btn block ghost" style="margin-top:14px" id="retry">${svg("refresh", "sm")} ${L("Повторить", "Retry")}</button>`;
  $("#s-gate").innerHTML = `<div class="card gate">${body}</div>`;
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === "s-gate"));
  const r = $("#retry"); if (r) r.onclick = boot;
  const a = $("#agree"); if (a) a.onclick = async () => { try { await api("agree", {}); } catch (x) {} boot(); };
}

/* ---------- запуск ---------- */
async function boot() {
  try {
    const r = await api("boot");
    S.shop = r.shop; S.user = r.user; S.cats = r.cats;
    document.title = S.shop.title;
    applyTheme();
    renderNav();
    const start = location.hash.replace("#", "").replace("demo", "");
    if (["home", "catalog", "orders", "profile"].includes(start)) S.tab = start;
    S.stack = [];
    render(S.tab);
  } catch (e) {
    applyTheme();
    gate(e);
  }
}

const isAdmin = () => !!(S.user && S.user.is_admin);
async function apiForm(path, fd) {
  if (DEMO) return { ok: true, media: null };
  let r;
  try { r = await fetch(BASE + "api/" + path, { method: "POST", headers: { "X-Init-Data": tg ? tg.initData : "" }, body: fd }); }
  catch (e) { throw { message: "Нет соединения" }; }
  let data = {};
  try { data = await r.json(); } catch (e) { data = { ok: false, message: r.status === 413 ? "Файл слишком большой" : "Ошибка сервера" }; }
  if (!data.ok) throw data;
  return data;
}

async function saveProd() {
  const p = S.product;
  const body = { name: $("#edName").value, emoji_id: ED.emoji || "", description: $("#edDesc").value, active: $("#edActive").checked };
  if ($("#edPrice")) {
    const base = parseFloat($("#edPrice").value.replace(",", ".")), disc = parseFloat(($("#edDisc").value || "").replace(",", "."));
    if (!(base >= 0)) return toast(L("Цена должна быть числом", "Price must be a number"));
    if (disc >= base) return toast(L("Цена со скидкой должна быть меньше обычной", "Sale price must be lower"));
    body.price = disc >= 0 ? disc : base; body.old_price = disc >= 0 ? base : 0;
  }
  setBusy(true);
  try { await api("admin/product/" + p.id, body); haptic("ok"); toast(L("Сохранено", "Saved")); closeSheet(); render("product", p.id); }
  catch (e) { toast(e.message || "Ошибка"); } finally { setBusy(false); }
}

/* загрузка и удаление медиа */
async function uploadMedia(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 45 * 1024 * 1024) return toast(L("Файл больше 45 МБ", "File is over 45 MB"));
  const fd = new FormData();
  fd.append("target", input.dataset.upload); fd.append("id", input.dataset.id || "0"); fd.append("file", file, file.name);
  const box = $("#edMedia-" + input.dataset.upload) || $("#edMedia");
  if (box) box.innerHTML = `<div class="skeleton" style="position:absolute;inset:0"></div>`;
  toast(L("Загружаю…", "Uploading…"));
  try {
    const r = await apiForm("admin/media", fd);
    if (box) box.innerHTML = mediaTag(r.media) || svg("image");
    haptic("ok"); toast(L("Готово", "Done"));
    mediaChanged = true;
    if (input.dataset.direct) { mediaChanged = false; await reloadShop(); if (S.tab === "home" && !S.stack.length) render("home"); }
  } catch (e) { if (box) box.innerHTML = svg("image"); haptic("err"); toast(e.message || "Ошибка"); }
  input.value = "";
}
let mediaChanged = false;
async function deleteMedia(target, id) {
  const fd = new FormData(); fd.append("target", target); fd.append("id", id || "0"); fd.append("remove", "1");
  try {
    await apiForm("admin/media", fd);
    const box = $("#edMedia-" + target) || $("#edMedia"); if (box) box.innerHTML = svg("image");
    mediaChanged = true; toast(L("Убрано", "Removed"));
  } catch (e) { toast(e.message || "Ошибка"); }
}
async function reloadShop() {
  try { const r = await api("boot"); S.shop = r.shop; S.user = r.user; S.cats = r.cats; applyTheme(); renderNav(); } catch (e) {}
}

/* выбор премиум-эмодзи из наборов */
let PICK = { packs: null, cur: "used", cb: null };
async function openPicker(cb) {
  PICK.cb = cb;
  sheet2(`<h3>${svg("spark")} ${L("Премиум-эмодзи", "Premium emoji")}</h3>
    <div class="ed-row"><input class="inp" id="packLink" placeholder="t.me/addemoji/…"><button class="btn" style="flex:0 0 auto" data-act="pack-add" aria-label="add">${svg("plus")}</button></div>
    <div class="hint">${L("Вставьте ссылку на набор эмодзи (её даёт «Поделиться» у набора). Наборы запоминаются.", "Paste an emoji pack link. Packs are remembered.")}</div>
    <div id="pickBody"><div class="skeleton" style="height:160px;margin-top:12px"></div></div>`);
  if (!PICK.packs) { try { PICK.packs = (await api("admin/emoji")).packs; } catch (e) { PICK.packs = []; toast(e.message || "Ошибка"); } }
  drawPicker();
}
function drawPicker() {
  const packs = PICK.packs || [];
  if (!packs.find((p) => p.name === PICK.cur)) PICK.cur = (packs[0] || {}).name;
  const cur = packs.find((p) => p.name === PICK.cur);
  const items = cur ? cur.items : [];
  $("#pickBody").innerHTML = `<div class="chips" style="margin-top:10px">${packs.map((p) => `<button class="chip ${p.name === PICK.cur ? "on" : ""}" data-pack="${esc(p.name)}">${esc(p.title)}</button>`).join("")}</div>
    ${items.length ? `<div class="emo-grid">${items.map((i) => `<button data-emo="${i.id}" data-ch="${esc(i.e)}">${pe(i.id, i.e)}</button>`).join("")}</div>`
      : `<div class="empty" style="padding:24px 10px">${PICK.cur === "used" ? L("В магазине пока нет премиум-эмодзи. Добавьте набор по ссылке выше.", "No premium emoji yet. Add a pack above.") : L("Набор пуст", "Empty pack")}</div>`}
    ${cur && cur.name !== "used" ? `<button class="btn ghost sm" style="margin-top:10px" data-act="pack-del">${svg("trash", "sm")} ${L("Убрать набор из списка", "Remove pack")}</button>` : ""}`;
  hydrateEmoji($("#pickBody"), true);
}
async function addPack() {
  const link = ($("#packLink").value || "").trim();
  if (!link) return;
  try {
    const r = await api("admin/emoji?pack=" + encodeURIComponent(link));
    PICK.packs = r.packs; PICK.cur = (r.packs[1] || r.packs[0]).name; drawPicker(); $("#packLink").value = ""; haptic("ok");
  } catch (e) { haptic("err"); toast(e.message || "Ошибка"); }
}
function pickIcon() {
  openPicker((id, ch) => {
    ED.emoji = id;
    const box = $("#sheet [data-ed-icon]"); if (box) { box.innerHTML = pe(id, ch); hydrateEmoji(box); }
  });
}
function pickIntoDesc() {
  const ta = $("#edDesc"); const pos = ta.selectionStart ?? ta.value.length;
  openPicker((id, ch) => {
    const tag = `<tg-emoji emoji-id="${id}">${ch || "⭐"}</tg-emoji>`;
    ta.value = ta.value.slice(0, pos) + tag + ta.value.slice(pos);
  });
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act],[data-emo],[data-pack]");
  if (!t || !isAdmin()) return;
  if (t.dataset.emo) { const cb = PICK.cb; closeSheet2(); haptic("light"); return cb && cb(t.dataset.emo, t.dataset.ch); }
  if (t.dataset.pack) { PICK.cur = t.dataset.pack; return drawPicker(); }
  switch (t.dataset.act) {
    case "edit-prod": return openProdEditor();
    case "edit-cat": return openCatEditor(+t.dataset.cid);
    case "edit-shop": return openShopEditor();
    case "admin-hint": return sheet(`<h3>${svg("info")} ${L("Режим админа", "Admin mode")}</h3><p>${L("Эти кнопки видите только вы и другие админы.", "Only admins see these buttons.")}</p>
      <div class="list"><div class="card row"><span class="ri">${svg("pencil")}</span><span class="rt"><b>${L("Товар", "Product")}</b><span>${L("Откройте товар → ✏️ вверху: фото/видео, премиум-эмодзи, название, цена, описание", "Open a product → ✏️")}</span></span></div>
      <div class="card row"><span class="ri">${svg("folder")}</span><span class="rt"><b>${L("Категория", "Category")}</b><span>${L("Откройте категорию → ✏️: обложка, эмодзи, название", "Open a category → ✏️")}</span></span></div>
      <div class="card row"><span class="ri">${svg("home")}</span><span class="rt"><b>${L("Витрина", "Storefront")}</b><span>${L("Название, фон и логотип карточки, обои", "Title, background, logo, wallpaper")}</span></span></div></div>`);
    case "pick-icon": return pickIcon();
    case "pick-desc": return pickIntoDesc();
    case "icon-clear": { ED.emoji = null; const box = $("#sheet [data-ed-icon]"); if (box) box.textContent = "—"; return; }
    case "save-prod": return saveProd();
    case "save-cat": return saveCat();
    case "save-title": try { await api("admin/app", { title: $("#edTitle").value }); toast(L("Сохранено", "Saved")); mediaChanged = true; } catch (x) { toast(x.message || "Ошибка"); } return;
    case "media-del": return deleteMedia(t.dataset.target, t.dataset.id);
    case "pack-add": return addPack();
    case "pack-del": try { await api("admin/pack_del", { name: PICK.cur }); PICK.packs = PICK.packs.filter((p) => p.name !== PICK.cur); drawPicker(); } catch (x) {} return;
  }
});
document.addEventListener("change", (e) => { if (e.target.matches("input[data-upload]")) uploadMedia(e.target); });
