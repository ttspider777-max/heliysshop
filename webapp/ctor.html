<!doctype html>
<html lang="ru" data-theme="dark" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Конструктор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script>window.__NY_LITE = true;</script>
<style>
/* Мини-приложение конструктора Heliys, премиальный стиль:
   OLED-чёрная тема по умолчанию и белая по выбору, главное действие — белая (чёрная) кнопка, акцент — холодный синий.
   Один запоминающийся элемент — чёрная и белая темы, тихий снег; остальное спокойное. */
:root {
  /* премиальный OLED-чёрный: поверхности чуть светлее фона, границы — волосяные линии, акцент холодный серебристо-синий */
  --accent: #7db2ff; --accent-ink: #04101f; --accent-text: #8dbbff;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --bg: #000000; --surface: #0c0c0e; --surface-2: #141417; --surface-3: #1e1e23; --line: rgba(255, 255, 255, .09);
  --text: #f4f5f8; --muted: #8d919b;
  --cta: #f4f6fb; --cta-ink: #0a0a0c;
  --fir: #4f8cff;
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --r-lg: 18px; --r-md: 12px; --r-sm: 9px;
  --ease: cubic-bezier(.23, 1, .32, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --accent: #2a63d4; --accent-ink: #ffffff; --accent-text: #2a63d4;
  --bg: #f5f6f9; --surface: #ffffff; --surface-2: #eceef3; --surface-3: #dcdfe7; --line: rgba(10, 14, 28, .10);
  --text: #0b0d13; --muted: #5a606c;
  --cta: #0b0d13; --cta-ink: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { font: 500 15px/1.5 var(--font); color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; display: block; }
.ic.sm { width: 16px; height: 16px; }
.wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 22px 16px calc(104px + var(--safe-b)); }
.screen { display: none; }
.screen.on { display: block; animation: rise .22s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pe { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; vertical-align: -0.25em; }
.pe img, .pe video, .pe svg { width: 100%; height: 100%; object-fit: contain; }
h1, h2, h3 { margin: 0; }

/* ---------- главная карточка: тёмное стекло, холодный блик, тонкая верхняя кромка ---------- */
.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 22px; min-height: 206px; padding: 28px 22px 20px; display: flex; flex-direction: column; color: #f4f6fb;
  background: #050507; border: 1px solid rgba(255, 255, 255, .11); }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(70% 90% at 100% 0%, rgba(96, 140, 255, .26), transparent 68%), radial-gradient(60% 70% at 0% 100%, rgba(170, 190, 255, .09), transparent 70%); }
.hero::after { content: ""; position: absolute; left: 14%; right: 14%; top: 0; height: 1px; z-index: 1;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent); }
.hero-media { position: absolute; inset: 0; z-index: -2; }
.hero-media img, .hero-media video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .45; }
.hero-title { position: relative; z-index: 2; font: 600 29px/1.12 var(--display); letter-spacing: -.012em; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 17ch; }
.hero-sub { position: relative; z-index: 2; margin-top: 10px; font-size: 14px; color: rgba(236, 240, 250, .72); max-width: 34ch; }
.hero-foot { position: relative; z-index: 3; margin-top: auto; padding-top: 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero-price small { display: block; font-size: 12.5px; color: rgba(236, 240, 250, .6); font-weight: 600; }
.hero-price b { font: 600 30px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.hero-price b i { font: 600 17px var(--font); font-style: normal; color: rgba(236, 240, 250, .55); margin-left: 3px; }
.chip-star { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); font-weight: 700; font-size: 13px; }
.chip-star .ic { color: #9ec3ff; }
@media (prefers-reduced-motion: reduce) { .screen.on { animation: none; } }

/* ---------- блоки ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 12px; font: 600 21px/1.2 var(--display); }
.section-title button { font: 700 13.5px var(--font); color: var(--accent-text); min-height: 32px; padding: 0 4px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.pill .ic { width: 15px; height: 15px; }
.pill.acc { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-text); }
.cta { margin-top: 12px; width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; text-align: left; border-radius: var(--r-lg);
  background: var(--cta); color: var(--cta-ink); transition: transform .16s var(--ease); min-height: 72px; }
.cta:active { transform: scale(.985); }
.cta .ci { width: 46px; height: 46px; border-radius: var(--r-md); display: grid; place-items: center; background: color-mix(in srgb, var(--cta-ink) 10%, transparent); flex: none; }
.cta .ci .ic { width: 24px; height: 24px; }
.cta b { display: block; font: 700 18px/1.2 var(--display); }
.cta span { display: block; font-size: 13px; opacity: .8; margin-top: 3px; font-weight: 600; }
.cta .arrow { margin-left: auto; flex: none; }
.feat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.feat:last-child { border-bottom: 0; }
.feat .fi { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--fir) 22%, transparent); color: #7fd4ff; flex: none; }
.feat .fi .ic { width: 15px; height: 15px; }
.bot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.bot + .bot { border-top: 1px solid var(--line); }
.bot .av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--accent-text); flex: none; }
.bot .av .ic { width: 20px; height: 20px; }
.bot .meta { flex: 1; min-width: 0; }
.bot .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bot .meta small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.st.running { background: #3ecf8e; } .st.failed, .st.expired { background: var(--berry); } .st.stopped { background: #e8b84a; }
.bot-actions { display: flex; flex-direction: column; gap: 6px; flex: none; align-items: stretch; }
.bot-actions .row { display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--r-md); font-weight: 700; background: var(--cta); color: var(--cta-ink); transition: opacity .15s, transform .16s var(--ease); white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.empty .ei { margin-bottom: 8px; display: grid; place-items: center; color: var(--accent-text); }
.empty .ei .ic { width: 32px; height: 32px; }
.stagger > * { animation: rise .3s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms); }

/* ---------- профиль ---------- */
.me { display: flex; align-items: center; gap: 14px; padding: 16px; }
.me .av { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--surface-3); font: 700 20px var(--display); flex: none; }
.me .av img { width: 100%; height: 100%; object-fit: cover; }
.me b { font: 700 18px var(--display); display: block; }
.me small { color: var(--muted); }
.amounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.amounts button { min-height: 48px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; }
.amounts button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.inp { width: 100%; min-height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; outline: none; font-size: 16px; }
.area { width: 100%; min-height: 104px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 12px 14px; outline: none; resize: none; font-size: 16px; }
.inp:focus, .area:focus { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
.counter { text-align: right; color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 8px; }

/* ---------- выбор типа бота ---------- */
.kinds { display: grid; gap: 10px; }
.kind { display: flex; align-items: center; gap: 14px; padding: 14px; width: 100%; text-align: left; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line);
  transition: border-color .15s, transform .16s var(--ease); min-height: 76px; }
.kind:active { transform: scale(.985); }
.kind .ki { width: 46px; height: 46px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--surface-2); color: var(--accent-text); flex: none; }
.kind .ki .ic { width: 23px; height: 23px; }
.kind .kt { flex: 1; min-width: 0; }
.kind .kt b { display: block; font: 600 17px/1.25 var(--display); }
.kind .kt small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
.kind .kp { text-align: right; flex: none; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.kind .kp small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }
@media (hover: hover) and (pointer: fine) { .kind:hover, .plan:hover, .mode:hover, .sty:hover, .sw:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); } }

/* ---------- мастер ---------- */
.wz-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.wz-head .back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.progress { flex: 1; display: grid; gap: 4px; }
.progress i { height: 4px; border-radius: 9px; background: var(--surface-3); transition: background .25s; }
.progress i.on { background: var(--accent); }
.wz-step { color: var(--muted); font-weight: 700; font-size: 13px; flex: none; font-variant-numeric: tabular-nums; }
.preview-label { color: var(--muted); font-size: 13px; font-weight: 600; margin: 0 2px 8px; }
.preview .hero { min-height: 190px; padding-top: 36px; }
.preview .hero.pv { border-color: color-mix(in srgb, var(--pc) 40%, var(--line)); background: radial-gradient(90% 70% at 100% 100%, color-mix(in srgb, var(--pc) 30%, transparent), transparent 70%), #0c0c0e; padding: 16px; }
.preview .pv .hero-title { font-size: 20px; }
.pv .badge { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .14); font-weight: 700; font-size: 13px; white-space: nowrap; }
.pv .badge .bi { width: 22px; height: 22px; display: grid; place-items: center; }
.pv .hero-top { display: flex; align-items: center; gap: 8px; }
.pv .hero-top .hero-title { flex: 1; min-width: 0; }
.pv .hero-bottom { position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; }
.pv .fake-bal { font: 700 26px/1 var(--display); }
.pv .hero-label { font-size: 12.5px; color: rgba(255, 255, 255, .7); font-weight: 600; }
.pv .fake-btn { height: 34px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; font-weight: 700; font-size: 13px; background: var(--pc); color: var(--pink); }
.pv .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pv .p { position: absolute; top: -10%; left: var(--x); width: var(--s); height: var(--s); animation: pfall var(--d) linear var(--delay) infinite; opacity: var(--o, .9); }
.pv .p > * { width: 100%; height: 100%; display: block; }
@keyframes pfall { to { top: 110%; } }
.pv .p.up { top: auto; bottom: -10%; animation-name: prise; }
@keyframes prise { to { bottom: 110%; } }
.pv .flake { border-radius: 50%; background: #fff; }
.pv .bat { position: absolute; top: var(--y); left: -12%; width: var(--s); animation: fly var(--d) linear var(--delay) infinite; }
.pv .bat svg { width: 100%; display: block; overflow: visible; }
@keyframes fly { from { left: -14%; } to { left: 112%; } }
.kindpv { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 22px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); background: linear-gradient(165deg, #060b10, #000 78%); color: #ecf6ff; }
.kindpv .ki { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: rgba(92, 200, 255, .16); color: #5cc8ff; flex: none; }
.kindpv .ki .ic { width: 26px; height: 26px; }
.kindpv b { display: block; font: 700 20px/1.2 var(--display); overflow-wrap: anywhere; }
.kindpv small { color: rgba(236, 246, 255, .72); font-size: 13px; }
.chatpv { border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); padding: 14px; }
.chatpv .bubble { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; max-width: 92%; overflow-wrap: anywhere; }
.chatpv .kbd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.chatpv .kbd span { background: var(--surface-2); border-radius: 10px; padding: 9px 6px; text-align: center; font-size: 12.5px; font-weight: 700; }
.chatpv .kbd .wide { grid-column: 1 / -1; background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); }
.wz-title { font: 700 23px/1.2 var(--display); margin: 24px 2px 4px; }
.wz-sub { color: var(--muted); margin: 0 2px 16px; font-size: 14px; }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 13.5px; transition: border-color .15s, transform .16s var(--ease); min-height: 44px; }
.sw:active { transform: scale(.97); }
.sw i { width: 40px; height: 40px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); display: grid; place-items: center; color: #fff; }
.sw.on { border-color: var(--c2, var(--accent)); background: color-mix(in srgb, var(--c2, var(--accent)) 10%, var(--surface)); }
.custom { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 12px; }
.custom input[type=color] { width: 46px; height: 46px; border: 0; padding: 0; border-radius: 12px; background: none; flex: none; cursor: pointer; }
.custom input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.custom input[type=color]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 12px; }
.custom .inp { flex: 1; text-transform: lowercase; }
.custom-btn { margin-top: 10px; width: 100%; min-height: 48px; border-radius: var(--r-md); border: 1.5px dashed var(--line); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.custom-btn.on { border-style: solid; border-color: var(--accent); color: var(--accent-text); }
.styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sty { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; text-align: left; transition: border-color .15s; min-height: 56px; }
.sty .si { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.sty.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.modes { display: grid; gap: 10px; }
.mode { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid var(--line); text-align: left; transition: border-color .15s, transform .16s var(--ease); }
.mode:active { transform: scale(.98); }
.mode .mi { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-text); flex: none; }
.mode .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mode .mt b { font-size: 15px; }
.mode .mt small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.mode i { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; color: var(--accent-ink); }
.mode.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.mode.on i { background: var(--accent); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 10px 12px; min-height: 40px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; text-align: left; line-height: 1.35; }
.chip:active { border-color: var(--accent); }
.wz-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + var(--safe-b)); background: linear-gradient(180deg, transparent, var(--bg) 32%); }
.wz-bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.wz-bar .btn { flex: 1; min-height: 52px; font-size: 15.5px; }
.wz-done { text-align: center; padding: 48px 12px; }
.wz-done .di { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.wz-done .di .ic { width: 34px; height: 34px; }
.wz-done h2 { font: 700 24px var(--display); margin: 0 0 8px; }
.wz-done p { color: var(--muted); margin: 0 0 20px; }
.steps-left { text-align: left; margin: 0 auto 22px; max-width: 340px; }
.steps-left div { display: flex; gap: 10px; align-items: center; padding: 8px 0; font-weight: 600; }
.steps-left span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 800; flex: none; }

/* ---------- навигация, тосты, листы ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 6px 16px calc(6px + var(--safe-b)); background: color-mix(in srgb, var(--bg) 88%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11.5px; font-weight: 700; color: var(--muted); transition: color .15s; }
.nav button.on { color: var(--accent-text); }

let lottieP = null;
function loadLottie() {
  if (window.lottie) return Promise.resolve(window.lottie);
  if (!lottieP) lottieP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"; s.onload = () => res(window.lottie); s.onerror = rej; document.head.appendChild(s); });
  return lottieP;
}
async function hydrateEmoji(root = document) {
  root.querySelectorAll("tg-emoji[emoji-id]").forEach((el) => { const sp = document.createElement("span"); sp.className = "pe"; sp.dataset.eid = el.getAttribute("emoji-id"); sp.textContent = el.textContent; el.replaceWith(sp); });
  const els = [...root.querySelectorAll(".pe[data-eid]:not([data-done])")];
  if (!els.length || DEMO) return;
  const need = [...new Set(els.map((e) => e.dataset.eid))].filter((id) => !(id in S.emoji));
  if (need.length) {
    try { Object.assign(S.emoji, await (await fetch("/api/emoji?ids=" + need.join(","))).json()); } catch (e) {}
    need.forEach((id) => { if (!(id in S.emoji)) S.emoji[id] = null; });
  }
  for (const el of els) {
    const info = S.emoji[el.dataset.eid]; el.dataset.done = "1";
    if (!info) continue;
    const url = "/" + info.url;
    if (info.type === "image") el.innerHTML = `<img src="${url}" alt="">`;
    else if (info.type === "video") el.innerHTML = `<video src="${url}" ${info.thumb ? `poster="/${info.thumb}"` : ""} autoplay loop muted playsinline></video>`;
    else { try { const lottie = await loadLottie(); el.textContent = ""; lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: true, path: url }); } catch (e) {} }
  }
}

/* ===================== снег на canvas: три слоя глубины, ветер, лёгкое качание ===================== */
const SnowFx = (() => {
  let cv, ctx, W = 0, H = 0, flakes = [], raf = 0, last = 0, t = 0;
  const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sprites = {};
  function sprite(r, a, soft) {
    const k = r + "_" + a;
    if (sprites[k]) return sprites[k];
    const d = Math.ceil(r * 2 + 4), c = document.createElement("canvas");
    c.width = c.height = d * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr);
    const g = x.createRadialGradient(d / 2, d / 2, 0, d / 2, d / 2, r);
    g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(soft ? .35 : .6, `rgba(255,255,255,${a * (soft ? .55 : .85)})`); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.beginPath(); x.arc(d / 2, d / 2, r, 0, 7); x.fill();
    return (sprites[k] = { c, d });
  }
  const LAYERS = [ // тихий снег: мелкие хлопья в два слоя, чтобы он оставался фоном и не спорил с интерфейсом
    { r: [1.0, 1.7], v: [14, 26], a: .5, n: 34, sway: 5, soft: false },
    { r: [1.8, 2.7], v: [28, 44], a: .65, n: 14, sway: 10, soft: false },
  ];
  function build() {
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const area = Math.min(Math.max((W * H) / (390 * 844), .7), 1.7), perf = (navigator.hardwareConcurrency || 8) <= 4 ? .7 : 1;
    flakes = [];
    LAYERS.forEach((L, li) => {
      const n = Math.round(L.n * area * perf * (RM ? .4 : 1));
      for (let i = 0; i < n; i++) {
        const r = rnd(L.r[0], L.r[1]);
        flakes.push({ x: rnd(0, W), y: rnd(0, H), r, v: rnd(L.v[0], L.v[1]), a: L.a, ph: rnd(0, 6.28), fq: rnd(.4, 1.1), sw: L.sway, s: sprite(Math.round(r * 2) / 2, L.a, L.soft) });
      }
    });
  }
  function draw() { ctx.clearRect(0, 0, W, H); for (const f of flakes) ctx.drawImage(f.s.c, f.x - f.s.d / 2, f.y - f.s.d / 2, f.s.d, f.s.d); }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (document.hidden || document.documentElement.dataset.theme === "light") { last = now; return; }
    const dt = Math.min((now - last) / 1000, .05); last = now; t += dt;
    const gust = Math.sin(t * .23) * 16 + Math.sin(t * .071) * 9;
    for (const f of flakes) {
      f.y += f.v * dt; f.x += (gust * (f.r / 4) + Math.sin(t * f.fq + f.ph) * f.sw) * dt;
      if (f.y - f.s.d > H) { f.y = -f.s.d; f.x = rnd(0, W); }
      if (f.x < -20) f.x = W + 20; else if (f.x > W + 20) f.x = -20;
    }
    draw();
  }
  return {
    start() {
      cv = document.createElement("canvas"); cv.id = "snow"; cv.setAttribute("aria-hidden", "true"); document.body.appendChild(cv);
      ctx = cv.getContext("2d"); build();
      let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); if (RM) draw(); }, 150); });
      if (RM) draw(); else raf = requestAnimationFrame((n) => { last = n; frame(n); });
    },
  };
})();

/* ---------- API ---------- */
async function api(path, body) {
  if (DEMO) return demoApi(path, body);
  const r = await fetch("/c/api/" + path, { method: body ? "POST" : "GET", headers: { "X-Init-Data": tg.initData, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok || data.ok === false) { const e = new Error(data.message || "Ошибка, попробуйте ещё раз"); e.data = data; throw e; }
  return data;
}

      kinds: r.kinds || [], swap: r.swap || { on: false, price: 50 }, chat: r.chat || [], course: !!r.course });
    document.title = plain(S.app.texts.app_title) || "Конструктор";
    $("#loader").remove();
    const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
    const h = location.hash;
    const create = h.startsWith("#create") || start === "create";
    if (create && S.kinds.length > 1) go("kind");
    else { if (create) S.kind = (S.kinds[0] || {}).id || "shop"; go(create ? "plan" : h.startsWith("#chat") ? "chat" : h.startsWith("#faq") ? "faq" : h.startsWith("#tariffs") ? "tariffs" : "home"); }
    if (!h.startsWith("#create") && !h.startsWith("#chat")) onboarding();
  } catch (e) {
    const ld = $("#loader"); if (ld) ld.remove();
    if (e.data && e.data.error === "sub") return showGate(e.data.sub);
    $("#s-error").innerHTML = `<div class="err"><b>Не получилось открыть</b>${esc(e.message)}</div>`;
    show("error");
  }
}

/* ---------- обязательная подписка ---------- */
function showGate(sub) {
  $("#nav").hidden = true; $("#wzbar").hidden = true;
  $("#s-error").innerHTML = `<div class="gate"><div class="gi">${svg("megaphone")}</div><h2>${sub.title}</h2><p>${sub.text}</p>
    ${sub.channels.map((c) => `<button class="card chan" data-sublink="${esc(c.url || "")}"><span class="ci">${svg("megaphone", "sm")}</span>${esc(c.title || "Канал")}<span class="arrow">${svg("right", "sm")}</span></button>`).join("")}
    <button class="btn block" style="margin-top:12px" id="subCheck">${svg("check", "sm")} ${sub.check}</button></div>`;
  show("error");
  hydrateEmoji($("#s-error"));
  $("#s-error").querySelectorAll("[data-sublink]").forEach((b) => b.onclick = () => openLink(b.dataset.sublink));
  $("#subCheck").onclick = async (ev) => {
    ev.target.disabled = true;
    $("#s-error").innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    await boot();
  };
}

/* ---------- заставка при запуске: ёлка, снег и HELIYS (один раз за сеанс, по касанию — пропустить) ---------- */
function runSplash() {
  let seen = false;
  try { seen = sessionStorage.getItem("ctor_splash") === "1"; sessionStorage.setItem("ctor_splash", "1"); } catch (e) {}
  if (seen || location.hash.indexOf("nosplash") >= 0) return Promise.resolve();
  const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.createElement("div");
  el.className = "splash" + (RM ? " rm" : "");
  el.setAttribute("aria-hidden", "true");
  const letters = "HELIYS".split("");
  el.innerHTML = `<div class="sp-glow"></div><div class="sp-mark">
    <div class="sp-word">${letters.map((c, i) => `<span><i style="--i:${i}">${c}</i></span>`).join("")}<div class="sp-shine">${letters.map((c) => `<span>${c}</span>`).join("")}</div></div>
    <div class="sp-rule"></div><div class="sp-cap">конструктор ботов</div></div>`;
  document.body.appendChild(el);
  haptic("light");
  return new Promise((res) => {
    let done = false;
    const close = () => { if (done) return; done = true; haptic("light"); el.classList.add("out"); setTimeout(() => { el.remove(); res(); }, 620); };
    el.addEventListener("click", close);
    setTimeout(close, RM ? 900 : 3500);
  });
}
