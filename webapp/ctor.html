<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Конструктор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Мини-приложение бота-конструктора. Тот же визуальный язык, что у витрины магазина (webapp/index.html). */
:root {
  --accent: #8b5cf6; --accent-ink: #fff;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --bg: #000; --surface: #0f0f11; --surface-2: #18181b; --surface-3: #222226; --line: #232328;
  --text: #f5f5f7; --muted: #8e8e96;
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Unbounded", "Manrope", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { font: 500 15px/1.5 var(--font); color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; display: block; }
.ic.sm { width: 16px; height: 16px; }
.wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 12px 16px calc(96px + var(--safe-b)); }
.screen { display: none; animation: rise .22s ease-out; }
.screen.on { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.pe { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; vertical-align: -0.25em; }
.pe img, .pe video, .pe svg { width: 100%; height: 100%; object-fit: contain; }

/* ---------- карточка ---------- */
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); min-height: 200px; padding: 16px; color: #fff; isolation: isolate;
  border: 1px solid var(--line); background: radial-gradient(90% 70% at 100% 100%, color-mix(in srgb, var(--hc, var(--accent)) 26%, transparent), transparent 70%), #0c0c0e; }
.hero-media { position: absolute; inset: 0; z-index: -2; }
.hero-media img, .hero-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 36%, rgba(0,0,0,0) 50%, rgba(0,0,0,.72) 100%); }
.hero-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
.hero-title { font: 700 19px/1.15 var(--display); letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-sub { position: relative; z-index: 1; margin-top: 6px; font-size: 13.5px; color: rgba(255,255,255,.78); max-width: 34ch; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.14); font-weight: 700; font-size: 13px; white-space: nowrap; }
.badge .bi { width: 22px; height: 22px; display: grid; place-items: center; font-size: 17px; }
.hero-bottom { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero-label { font-size: 13px; color: rgba(255,255,255,.72); font-weight: 600; }
.balance { font: 700 34px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.balance small { font-size: 19px; font-weight: 600; color: rgba(255,255,255,.55); margin-left: 4px; }
.plus { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #000; flex: none; transition: transform .15s; }
.plus:active { transform: scale(.94); }
.fx { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bat { position: absolute; top: var(--y); left: -12%; width: var(--s); animation: fly var(--d) linear var(--delay) infinite; }
.bat.rev { animation-name: fly-rev; }
.bat .bob { animation: bob calc(var(--d) / 4) ease-in-out infinite; }
.bat svg { width: 100%; display: block; overflow: visible; }
.bat.rev svg { transform: scaleX(-1); }
.bat .wing { transform-box: fill-box; transform-origin: 50% 70%; animation: flap .34s ease-in-out infinite; }
@keyframes fly { from { left: -14%; } to { left: 112%; } }
@keyframes fly-rev { from { left: 112%; } to { left: -14%; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(14px) rotate(5deg); } }
@keyframes flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.35) translateY(4px); } }
.p { position: absolute; top: -10%; left: var(--x); width: var(--s); height: var(--s); animation: fall var(--d) linear var(--delay) infinite; opacity: var(--o, .9); }
.p.up { top: auto; bottom: -10%; animation-name: rise-up; }
.p > * { width: 100%; height: 100%; display: block; animation: sway calc(var(--d) / 3) ease-in-out infinite alternate; }
@keyframes fall { to { top: 110%; } }
@keyframes rise-up { to { bottom: 110%; } }
@keyframes sway { from { transform: translateX(-10px) rotate(-25deg); } to { transform: translateX(10px) rotate(35deg); } }
.flake { border-radius: 50%; background: #fff; }
.pumpkin { transform-origin: 50% 85%; animation: wobble 2.6s ease-in-out infinite; }
.pumpkin .face { animation: flicker 1.8s steps(1) infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-1px); } }
@keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .55; } 45% { opacity: 1; } 70% { opacity: .8; } }
.spin { animation: spin 9s linear infinite; }
.beat { animation: beat 1.1s ease-in-out infinite; transform-origin: center; }
.sway-i { animation: wobble 3s ease-in-out infinite; transform-origin: 50% 100%; }
.blink { animation: flicker 1.2s steps(1) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.96); } 45% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .fx { display: none; } .spin, .beat, .sway-i, .pumpkin, .blink { animation: none; } }

/* ---------- блоки ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 2px 12px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.section-title button { font-weight: 700; font-size: 13.5px; color: var(--accent); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.pill.acc { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); }
.cta { margin-top: 12px; width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; text-align: left; border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #a855f7)); color: var(--accent-ink); transition: transform .12s; }
.cta:active { transform: scale(.985); }
.cta .ci { width: 48px; height: 48px; border-radius: var(--r-md); display: grid; place-items: center; background: rgba(0,0,0,.18); font-size: 26px; flex: none; }
.cta .ci .ic { width: 26px; height: 26px; }
.cta b { display: block; font: 700 17px/1.2 var(--display); }
.cta span { display: block; font-size: 13px; opacity: .85; margin-top: 3px; }
.cta .arrow { margin-left: auto; flex: none; }
.feats { padding: 6px 14px; }
.feat { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.feat:last-child { border-bottom: 0; }
.feat .fi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; font-size: 16px; }
.bot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.bot + .bot { border-top: 1px solid var(--line); }
.bot .av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font: 700 14px var(--display); flex: none; }
.bot .meta { flex: 1; min-width: 0; }
.bot .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bot .meta small { display: block; color: var(--muted); font-size: 12.5px; }
.st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.st.running { background: #22c55e; } .st.failed, .st.expired { background: #ef4444; } .st.stopped { background: #eab308; }
.bot-actions { display: flex; gap: 6px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-md); font-weight: 700; background: var(--accent); color: var(--accent-ink); transition: opacity .15s, transform .12s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty .ei { font-size: 34px; margin-bottom: 6px; }

/* ---------- профиль ---------- */
.me { display: flex; align-items: center; gap: 14px; padding: 16px; }
.me .av { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--surface-3); font: 700 18px var(--display); flex: none; }
.me .av img { width: 100%; height: 100%; object-fit: cover; }
.me b { font: 700 17px var(--display); display: block; }
.me small { color: var(--muted); }
.amounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.amounts button { height: 46px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; }
.amounts button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.inp { width: 100%; height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; outline: none; }
.area { width: 100%; min-height: 104px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 12px 14px; outline: none; resize: none; }
.inp:focus, .area:focus { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
.counter { text-align: right; color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.counter.bad { color: #ef4444; }

/* ---------- мастер ---------- */
.wz-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.wz-head .back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.progress { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.progress i { height: 5px; border-radius: 9px; background: var(--surface-3); transition: background .25s; }
.progress i.on { background: var(--accent); }
.wz-step { color: var(--muted); font-weight: 700; font-size: 13px; flex: none; font-variant-numeric: tabular-nums; }
.preview-label { color: var(--muted); font-size: 12.5px; font-weight: 700; margin: 0 2px 8px; text-transform: uppercase; letter-spacing: .04em; }
.preview .hero { min-height: 206px; }
.hero-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.preview .fake-bal { font: 700 26px/1 var(--display); }
.preview .fake-btn { height: 34px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; font-weight: 700; font-size: 13px; background: var(--pc); color: var(--pink); }
.wz-title { font: 700 21px/1.2 var(--display); margin: 22px 2px 4px; letter-spacing: -.01em; }
.wz-sub { color: var(--muted); margin: 0 2px 16px; font-size: 14px; }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 13.5px; transition: border-color .15s, transform .12s; }
.sw:active { transform: scale(.97); }
.sw i { width: 40px; height: 40px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); display: grid; place-items: center; color: #fff; }
.sw.on { border-color: var(--c2, var(--accent)); background: color-mix(in srgb, var(--c2, var(--accent)) 10%, var(--surface)); }
.custom { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 12px; }
.custom input[type=color] { width: 46px; height: 46px; border: 0; padding: 0; border-radius: 12px; background: none; flex: none; cursor: pointer; }
.custom input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.custom input[type=color]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 12px; }
.custom .inp { flex: 1; text-transform: lowercase; }
.custom-btn { margin-top: 10px; width: 100%; height: 48px; border-radius: var(--r-md); border: 1.5px dashed var(--line); color: var(--text); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.custom-btn.on { border-style: solid; border-color: var(--accent); color: var(--accent); }
.styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sty { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; text-align: left; transition: border-color .15s; }
.sty .si { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); flex: none; font-size: 18px; }
.sty.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 8px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; text-align: left; line-height: 1.35; }
.chip:active { border-color: var(--accent); }
.wz-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + var(--safe-b)); background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.wz-bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.wz-bar .btn { flex: 1; height: 50px; font-size: 15.5px; }
.wz-bar .btn.ghost { flex: 0 0 auto; }
.wz-done { text-align: center; padding: 48px 12px; }
.wz-done .di { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.wz-done .di .ic { width: 36px; height: 36px; }
.wz-done h2 { font: 700 21px var(--display); margin: 0 0 8px; }
.wz-done p { color: var(--muted); margin: 0 0 20px; }
.steps-left { text-align: left; margin: 0 auto 22px; max-width: 340px; }
.steps-left div { display: flex; gap: 10px; align-items: center; padding: 8px 0; font-weight: 600; }
.steps-left span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 800; flex: none; }

/* ---------- навигация, тосты ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 16px calc(8px + var(--safe-b)); background: rgba(10,10,12,.94); border-top: 1px solid var(--line); backdrop-filter: blur(16px); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.nav button.on { color: var(--accent); }
.nav .ni { width: 24px; height: 24px; display: grid; place-items: center; font-size: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%) translateY(20px); z-index: 60; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: var(--r-md); background: #26262b; color: #fff; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.loader { display: grid; place-items: center; min-height: 70vh; color: var(--muted); }
.spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.err { text-align: center; padding: 60px 20px; color: var(--muted); }
.err b { display: block; color: var(--text); font: 700 18px var(--display); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loader" class="loader"><div class="spinner"></div></div>
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-bots"></section>
  <section class="screen" id="s-profile"></section>
  <section class="screen" id="s-wizard"></section>
  <section class="screen" id="s-error"></section>
</div>
<nav class="nav" id="nav" hidden></nav>
<div class="wz-bar" id="wzbar" hidden><div class="in"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = !(tg && tg.initData) || location.hash === "#demo";
const S = { tab: "home", app: null, user: null, wz: null, emoji: {}, topupAmount: null };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plain = (s) => String(s || "").replace(/<[^>]+>/g, "");
const money = (v) => { v = Math.round((+v || 0) * 100) / 100; return (Number.isInteger(v) ? v.toLocaleString("ru-RU") : v.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 })) + " ₽"; };
const T = (k) => (S.app && S.app.texts[k]) || "";
function haptic(kind = "light") { try { tg && tg.HapticFeedback && (kind === "ok" ? tg.HapticFeedback.notificationOccurred("success") : kind === "err" ? tg.HapticFeedback.notificationOccurred("error") : tg.HapticFeedback.impactOccurred(kind)); } catch (e) {} }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); }
function inkFor(hex) {
  const h = String(hex || "#8b5cf6").replace("#", ""); const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
  return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150 ? "#140a02" : "#ffffff";
}
function setAccent(hex) {
  const r = document.documentElement.style;
  r.setProperty("--accent", hex); r.setProperty("--accent-ink", inkFor(hex));
}

/* ---------- иконки ---------- */
const ICONS = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  bot: '<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  spark: '<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.13-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.13a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.13 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0z"/>',

/* ---------- премиум-эмодзи ---------- */
let lottieP = null;
function loadLottie() {
  if (window.lottie) return Promise.resolve(window.lottie);
  if (!lottieP) lottieP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"; s.onload = () => res(window.lottie); s.onerror = rej; document.head.appendChild(s); });
  return lottieP;
}
async function hydrateEmoji(root = document) {
  root.querySelectorAll("tg-emoji[emoji-id]").forEach((el) => { const sp = document.createElement("span"); sp.className = "pe"; sp.dataset.eid = el.getAttribute("emoji-id"); sp.textContent = el.textContent; el.replaceWith(sp); });
  const els = [...root.querySelectorAll(".pe[data-eid]:not([data-done])")];
  if (!els.length || DEMO) return;
  const need = [...new Set(els.map((e) => e.dataset.eid))].filter((id) => !(id in S.emoji));
  if (need.length) {
    try { Object.assign(S.emoji, await (await fetch("/api/emoji?ids=" + need.join(","))).json()); } catch (e) {}
    need.forEach((id) => { if (!(id in S.emoji)) S.emoji[id] = null; });
  }
  for (const el of els) {
    const info = S.emoji[el.dataset.eid]; el.dataset.done = "1";
    if (!info) continue;
    const url = "/" + info.url;
    if (info.type === "image") el.innerHTML = `<img src="${url}" alt="">`;
    else if (info.type === "video") el.innerHTML = `<video src="${url}" ${info.thumb ? `poster="/${info.thumb}"` : ""} autoplay loop muted playsinline></video>`;
    else { try { const lottie = await loadLottie(); el.textContent = ""; lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: true, path: url }); } catch (e) {} }
  }
}

const rnd = (a, b) => a + Math.random() * (b - a);
function fxHtml(season) {
  const out = [];
  if (season === "halloween") {
    for (let i = 0; i < 5; i++) { const d = rnd(9, 16); out.push(`<div class="bat ${i % 2 ? "rev" : ""}" style="--y:${rnd(22, 52)}%;--s:${rnd(30, 52)}px;--d:${d}s;--delay:${-rnd(0, d)}s"><div class="bob">${BAT}</div></div>`); }
  } else if (season === "newyear" || season === "winter") {
    for (let i = 0; i < 22; i++) { const d = rnd(6, 13); out.push(`<div class="p" style="--x:${rnd(0, 100)}%;--s:${rnd(3, 7)}px;--d:${d}s;--delay:${-rnd(0, d)}s;--o:${rnd(.5, 1)}"><i class="flake"></i></div>`); }
  } else if (season === "autumn" || season === "spring") {
    const leaf = season === "autumn" ? (c) => `<svg viewBox="0 0 24 24"><path d="M12 2c3 3 8 4 9 3 0 6-3 13-9 17C6 18 3 11 3 5c1 1 6 0 9-3z" fill="${c}"/></svg>` : (c) => `<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="6" ry="10" fill="${c}"/></svg>`;
    const colors = season === "autumn" ? ["#ff8a1f", "#e8620c", "#ffb000", "#c94b1a"] : ["#ff9cc8", "#ffc0dc", "#ff7eb6"];
    for (let i = 0; i < 10; i++) { const d = rnd(8, 15); out.push(`<div class="p" style="--x:${rnd(0, 100)}%;--s:${rnd(12, 22)}px;--d:${d}s;--delay:${-rnd(0, d)}s">${leaf(colors[i % colors.length])}</div>`); }
  } else if (season === "valentine" || season === "summer") {
    const item = season === "valentine" ? () => `<svg viewBox="0 0 24 24"><path d="M12 21S2 15 2 8.5C2 5 4.6 3 7.5 3 9.5 3 11 4.2 12 6c1-1.8 2.5-3 4.5-3C19.4 3 22 5 22 8.5 22 15 12 21 12 21z" fill="#ff4d6d"/></svg>` : () => `<i class="flake" style="background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)"></i>`;
    for (let i = 0; i < 10; i++) { const d = rnd(7, 14); out.push(`<div class="p up" style="--x:${rnd(0, 100)}%;--s:${rnd(10, 20)}px;--d:${d}s;--delay:${-rnd(0, d)}s;--o:${rnd(.5, .9)}">${item()}</div>`); }
  }
  return out.join("");
}

/* ---------- API ---------- */
async function api(path, body) {
  if (DEMO) return demoApi(path, body);
  const r = await fetch("/c/api/" + path, { method: body ? "POST" : "GET", headers: { "X-Init-Data": tg.initData, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok || data.ok === false) throw new Error(data.message || "Ошибка, попробуйте ещё раз");
  return data;
}

function go(tab) {
  S.tab = tab;

  if (tab === "home") renderHome(); else if (tab === "bots") renderBots(); else if (tab === "profile") renderProfile(); else if (tab === "wizard") renderWizard();

    <div class="chips">${list.map((i) => `<button class="chip" data-desc="${esc(i)}">💡 ${esc(i)}</button>`).join("")}</div>`;
}
function stepValid() {
  const w = wzState();
  if (w.step === 1) return w.color === "custom" ? /^#[0-9a-f]{6}$/i.test(w.hex) : !!w.color;
  if (w.step === 2) return !!w.style;
  if (w.step === 3) return w.title.trim().length > 0 && w.title.trim().length <= 40;
  return w.desc.trim().length > 0 && w.desc.trim().length <= 200;
}
function renderWizard() {
  const w = wzState();
  setAccent(wzAccent());
  const prog = Array.from({ length: 7 }, (_, i) => `<i class="${i < w.step ? "on" : ""}"></i>`).join("");
  $("#s-wizard").innerHTML = `<div class="wz-head"><button class="back" data-act="wzback" aria-label="${esc(plain(T("app_back")))}">${svg("left")}</button><div class="progress">${prog}</div><span class="wz-step">${w.step} / 7</span></div>
    <div id="pv">${previewHtml()}</div><div id="stepBody">${stepHtml()}</div>`;
  renderBar();
  bindWizardInputs();
}
function renderBar() {
  const w = wzState();
  const last = w.step === STEPS;
  $("#wzbar .in").innerHTML = `<button class="btn" id="wzNext" data-act="${last ? "wzfinish" : "wznext"}" ${stepValid() ? "" : "disabled"}>${last ? svg("send", "sm") + " " + T("app_finish") : T("app_next") + " " + svg("right", "sm")}</button>`;
}
function refreshPreview() { $("#pv").innerHTML = previewHtml(); renderBar(); }
function bindWizardInputs() {
  const w = wzState();
  const hexInp = $("#hexInp"), pick = $("#colorPick");
  if (hexInp) hexInp.oninput = () => { let v = hexInp.value.trim(); if (v && v[0] !== "#") v = "#" + v; w.hex = v.toLowerCase(); if (/^#[0-9a-f]{6}$/i.test(w.hex)) { pick.value = w.hex; setAccent(w.hex); } refreshPreview(); };
  if (pick) pick.oninput = () => { w.hex = pick.value.toLowerCase(); hexInp.value = w.hex; setAccent(w.hex); refreshPreview(); };
  const ti = $("#titleInp");
  if (ti) ti.oninput = () => { w.title = ti.value; $("#titleCnt").textContent = `${ti.value.length}/40`; refreshPreview(); };
  const di = $("#descInp");
  if (di) di.oninput = () => { w.desc = di.value; const c = $("#descCnt"); c.textContent = `${di.value.length}/200`; refreshPreview(); };
}
async function finishWizard(btn) {
  const w = wzState();
  btn.disabled = true;
  try {
    await api("draft", { color: w.color, hex: w.hex, style: w.style, title: w.title.trim(), desc: w.desc.trim() });
    haptic("ok");
    $("#wzbar").hidden = true;
    $("#s-wizard").innerHTML = `<div class="wz-done"><div class="di">${svg("check")}</div><h2>Витрина готова!</h2><p>${T("app_finish_hint")}</p>
      <div class="steps-left"><div><span>5</span>Приветствие с премиум-эмодзи и фото</div><div><span>6</span>Контакт поддержки</div><div><span>7</span>Токен бота из @BotFather</div></div>
      <button class="btn block" data-act="close">${svg("chat", "sm")} Перейти в чат</button></div>`;
    S.wz = null;
    setTimeout(() => { try { tg && tg.close(); } catch (e) {} }, 1400);
  } catch (e) { haptic("err"); toast(e.message); btn.disabled = false; }
}

/* ---------- события ---------- */
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act],[data-tab],[data-color],[data-style],[data-title],[data-desc],[data-amount],[data-buy],[data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { haptic(); return go(d.tab); }
  if (d.open) return openLink(`https://t.me/${d.open}`);
  if (d.buy) return buyBot(+d.buy, el);
  const w = S.tab === "wizard" ? wzState() : null;
  if (d.color) { w.color = d.color; w.customOpen = false; haptic(); $("#stepBody").innerHTML = stepHtml(); bindWizardInputs(); setAccent(wzAccent()); return refreshPreview(); }
  if (d.style) { w.style = d.style; haptic(); $("#stepBody").innerHTML = stepHtml(); return refreshPreview(); }
  if (d.title) { w.title = d.title; haptic(); $("#stepBody").innerHTML = stepHtml(); bindWizardInputs(); return refreshPreview(); }
  if (d.desc) { w.desc = d.desc.slice(0, 200); haptic(); $("#stepBody").innerHTML = stepHtml(); bindWizardInputs(); return refreshPreview(); }
  if (d.amount) { S.topupAmount = +d.amount; haptic(); return renderProfile(); }
  switch (d.act) {
    case "create": haptic("medium"); S.wz = null; return go("wizard");
    case "custom": w.color = "custom"; w.customOpen = true; $("#stepBody").innerHTML = stepHtml(); bindWizardInputs(); setAccent(wzAccent()); refreshPreview(); return;
    case "wznext": if (!stepValid()) return; w.step++; haptic(); return renderWizard();
    case "wzback": if (w.step > 1) { w.step--; return renderWizard(); } setAccent(S.app.accent); return go("home");
    case "wzfinish": if (stepValid()) return finishWizard(el); return;
    case "topup": return go("profile");
    case "dotopup": return doTopup(el);
    case "support": return openLink(S.app.support);
    case "close": try { tg && tg.close(); } catch (e) {} return;
  }
});
function openLink(url) {
  if (!url) return;
  if (url.startsWith("@")) url = "https://t.me/" + url.slice(1);
  try { if (tg && /^https:\/\/t\.me\//.test(url)) return tg.openTelegramLink(url); if (tg) return tg.openLink(url); } catch (e) {}
  window.open(url, "_blank");
}
async function doTopup(btn) {
  const raw = ($("#amountInp").value || "").replace(",", ".").trim();
  const amount = raw ? +raw : S.topupAmount;
  if (!amount || amount < S.topup.min) { haptic("err"); return toast(`Сумма — от ${money(S.topup.min)}`); }
  btn.disabled = true;
  try { await api("topup", { amount }); haptic("ok"); toast("Реквизиты отправлены в чат с ботом"); setTimeout(() => { try { tg && tg.close(); } catch (e) {} }, 1200); }
  catch (e) { haptic("err"); toast(e.message); }
  btn.disabled = false;
}
async function buyBot(id, btn) {
  const go2 = async () => {
    btn.disabled = true;
    try { const r = await api("buy", { bot: id }); S.user.balance = r.balance; S.bots = r.bots; haptic("ok"); toast("Бот куплен навсегда"); go(S.tab); }
    catch (e) { haptic("err"); toast(e.message); btn.disabled = false; }
  };
  const msg = `Купить бота навсегда за ${money(S.price)}? Сумма спишется с баланса.`;
  if (tg && tg.showConfirm && !DEMO) tg.showConfirm(msg, (ok) => ok && go2()); else if (confirm(msg)) go2();
}

/* ---------- старт ---------- */
async function boot() {
  try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#000000"); tg.setBackgroundColor && tg.setBackgroundColor("#000000"); tg.BackButton && tg.BackButton.onClick(() => { if (S.tab === "wizard") { const w = wzState(); if (w.step > 1) { w.step--; return renderWizard(); } setAccent(S.app.accent); } go("home"); }); } } catch (e) {}
  try {
    const r = await api("boot");
    Object.assign(S, { app: r.app, user: r.user, colors: r.colors, styles: r.styles, price: r.price, trial: r.trial, bots: r.bots, draft: r.draft, ideas: r.ideas, topup: r.topup });
    setAccent(S.app.accent);
    document.title = plain(S.app.texts.app_title) || "Конструктор";
    $("#loader").remove();
    const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
    go(location.hash.startsWith("#create") || start === "create" ? "wizard" : "home");
  } catch (e) {
    $("#loader").remove();
    $("#s-error").innerHTML = `<div class="err"><b>Не получилось открыть</b>${esc(e.message)}</div>`;
    show("error");
  }
}
